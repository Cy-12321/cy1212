<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Outfit", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #e5ebe3 40%, #ebe8f0 70%, #e3eaf2 100%);
            overflow: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 55% at 15% 20%, rgba(147, 197, 253, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 85% 75%, rgba(167, 243, 208, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse 50% 45% at 70% 15%, rgba(196, 181, 253, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse 55% 40% at 30% 85%, rgba(254, 215, 170, 0.15) 0%, transparent 50%),
                linear-gradient(160deg, #eef2f8 0%, #e8f0ea 35%, #ede9f4 65%, #e6edf6 100%);
        }

        .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 80%);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(147, 197, 253, 0.2);
            top: 10%;
            left: 15%;
        }

        .orb-2 {
            width: 200px;
            height: 200px;
            background: rgba(167, 243, 208, 0.18);
            bottom: 15%;
            right: 20%;
            animation-delay: -3s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%       { transform: translate(20px, -30px) scale(1.05); }
            66%       { transform: translate(-15px, 20px) scale(0.95); }
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            animation: fadeUp 1s ease-out both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 0.02em;
            line-height: 1.2;
            color: #0d2b6e;
            text-shadow: 0 2px 20px rgba(13, 43, 110, 0.15);
        }

        .divider {
            width: 60px;
            height: 3px;
            margin: 1.5rem auto;
            background: linear-gradient(90deg, transparent, #1a3c8c, transparent);
            border-radius: 2px;
            animation: fadeUp 1s 0.3s ease-out both;
        }

        .intro {
            margin: 0 auto;
            max-width: 560px;
            font-size: clamp(1.15rem, 3.2vw, 1.4rem);
            font-weight: 400;
            line-height: 1.8;
            color: #2e7d32;
            animation: fadeUp 1s 0.5s ease-out both;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="content">
        <h1>我的第一个网页</h1>
        <div class="divider"></div>
        <p class="intro">我叫XX，在西飞国际天津公司装配空客 A320/A321 的液压系统，正在学习用 AI 做网页。</p>
    </div>
</body>
</html>
